name: security
on: [push, pull_request]
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }   # gitleaks needs history

      # GATE: secret scan — exit non-zero on a finding, so the build fails
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
                        detect --source /repo --config /repo/.gitleaks.toml --exit-code 1

      # GATE or REPORT (your choice): SAST
      - name: SAST (Semgrep)
        if: success() || failure()
        run: |
          pip install semgrep
          semgrep scan --config auto --error    # drop --error to make it a report

      # REPORT: dependency scan — surface findings without blocking
      - name: Dependency scan (Trivy)
        if: success() || failure()
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
